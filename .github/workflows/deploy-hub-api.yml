name: Build and Deploy hub-api

on:
  push:
    branches:
      - vps          # CI/CD chỉ chạy khi push vào nhánh vps
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hub-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hub-api:latest
            
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_IP: ${{ secrets.VPS_IP }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TAG: ${{ github.sha }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ssh_key.pem
          chmod 600 ssh_key.pem

          # SSH sang VPS, truyền DOCKER_USERNAME / DOCKER_TAG vào env của shell
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem \
            "$VPS_USER@$VPS_IP" \
            DOCKER_USERNAME="$DOCKER_USERNAME" DOCKER_TAG="$DOCKER_TAG" << 'EOF'
            set -e

            cd /opt/hub-api   # thư mục deploy trên VPS

            # Đọc tag hiện tại (nếu có)
            if [ -f .env ]; then
              CURRENT_DOCKER_TAG=$(grep '^DOCKER_TAG=' .env | cut -d '=' -f 2- || true)
            else
              CURRENT_DOCKER_TAG=""
            fi

            # Dừng container cũ (nếu đang chạy)
            docker compose down || true

            # Xoá image cũ (nếu có)
            if [ -n "$CURRENT_DOCKER_TAG" ]; then
              docker rmi ${DOCKER_USERNAME}/hub-api:$CURRENT_DOCKER_TAG || true
            fi

            # Cập nhật .env cho docker-compose (không đụng app.env)
            sed -i '/^DOCKER_USERNAME=/d' .env 2>/dev/null || true
            sed -i '/^DOCKER_TAG=/d' .env 2>/dev/null || true
            echo "DOCKER_USERNAME=${DOCKER_USERNAME}" >> .env
            echo "DOCKER_TAG=${DOCKER_TAG}" >> .env

            # Kéo image mới + chạy lại container
            docker compose pull hub-api
            docker compose up -d hub-api
          EOF
